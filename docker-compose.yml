services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      # Bind-mount the host's OneDrive\Downloads folder (which already exists)
      # into the container. The backend writes finished files to the "ytdlp"
      # subfolder, creating it on startup if missing (see DOWNLOAD_DIR below),
      # so completed downloads land in C:\Users\<you>\OneDrive\Downloads\ytdlp
      # on the Windows host instead of staying inside the container.
      - type: bind
        source: ${USERPROFILE}/OneDrive/Downloads
        target: /output
    environment:
      - DOWNLOAD_DIR=/output/ytdlp
